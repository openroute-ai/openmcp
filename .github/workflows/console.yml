name: console

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        # The integration suites need real tables: the behaviour under test is
        # a read-modify-write across two connections, which a mock cannot
        # reproduce. 17 is what docker-compose.yml runs locally, so CI and a
        # developer's machine agree.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: console_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration suites clear whole tables, so they only run when this
      # opt-in names a throwaway database. It is applied to
      # `CONSOLE_DATABASE_URL` by `src/test/setup-env.ts`. Do not add a real
      # `CONSOLE_DATABASE_URL` here — that would let a suite wipe production.
      CONSOLE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/console_test
      # Present but never used: the suites stub the clients, and a CI run must
      # not be able to reach the real API even by accident.
      GITHUB_ACCESS_TOKEN: ci-placeholder-token
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Applied rather than pushed, so the suites start from a known schema
      # without a migration step that could disagree with the checked-in one.
      # `db:migrate` reads `CONSOLE_DATABASE_URL` (not the test opt-in), so it
      # gets the CI database at the step level.
      - name: Apply migrations
        working-directory: apps/console
        env:
          CONSOLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/console_test
        run: pnpm db:migrate

      - name: Lint
        run: pnpm turbo lint --filter=console

      - name: Typecheck
        run: pnpm turbo typecheck --filter=console

      - name: Test
        run: pnpm turbo test --filter=console
